<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Nível de Água</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #2a2a3c;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
        }
        .distance-display {
            font-size: 48px;
            font-weight: bold;
            color: #00ffcc;
            margin: 10px 0 20px 0;
        }
        .status {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 20px;
        }
        .btn-acao {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn-acao:hover {
            background-color: #ff3377;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Monitor de Distância ESP32</h2>
        <div class="status" id="status">Conectando ao servidor...</div>
        
        <div class="distance-display">
            <span id="valorDistancia">--</span> cm
        </div>

        <!-- Botão para enviar comando ao ESP32 -->
        <button class="btn-acao" onclick="enviarComando()">Ligar / Desligar Relé</button>
        
        <div class="chart-container">
            <canvas id="historicoGrafico"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('historicoGrafico').getContext('2d');
        const maxPontos = 50; // Máximo de medições no gráfico
        
        // Tenta carregar o histórico salvo no navegador. Se não existir, cria um vazio.
        let dadosSalvos = JSON.parse(localStorage.getItem('historicoESP32')) || { labels: [], valores: [] };

        const grafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dadosSalvos.labels,
                datasets: [{
                    label: 'Distância (cm)',
                    data: dadosSalvos.valores,
                    borderColor: '#00ffcc',
                    backgroundColor: 'rgba(0, 255, 204, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                    y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255, 255, 255, 0.05)' }, beginAtZero: true }
                },
                plugins: { legend: { labels: { color: '#fff' } } }
            }
        });

        // Configuração MQTT
        const host = 'wss://broker.hivemq.com:8884/mqtt';
        const clientId = 'web_' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect(host, { clientId: clientId });
        
        const topic_distancia = "meu_esp32/sensor_distancia"; 
        const topic_comandos = "meu_esp32/comandos"; 

        client.on('connect', function () {
            document.getElementById('status').innerText = 'Online - Recebendo dados...';
            document.getElementById('status').style.color = '#00ffcc';
            client.subscribe(topic_distancia);
        });

        client.on('message', function (topic, message) {
            if(topic === topic_distancia) {
                const distancia = parseFloat(message.toString()).toFixed(1);
                document.getElementById('valorDistancia').innerText = distancia;

                const agora = new Date();
                const horaFormatada = agora.getHours().toString().padStart(2, '0') + ':' + 
                                      agora.getMinutes().toString().padStart(2, '0') + ':' + 
                                      agora.getSeconds().toString().padStart(2, '0');

                // Atualiza o histórico
                dadosSalvos.labels.push(horaFormatada);
                dadosSalvos.valores.push(distancia);

                // Remove os dados mais antigos se ultrapassar o limite
                if (dadosSalvos.labels.length > maxPontos) {
                    dadosSalvos.labels.shift();
                    dadosSalvos.valores.shift();
                }

                // Guarda os dados na memória do navegador
                localStorage.setItem('historicoESP32', JSON.stringify(dadosSalvos));
                grafico.update();
            }
        });

        // Envia o comando de alternância para o relé/LED
        function enviarComando() {
            if(client.connected) {
                client.publish(topic_comandos, "TOGGLE");
                console.log("Comando enviado!");
            } else {
                alert("Desconectado do servidor!");
            }
        }

        // Função para limpar o gráfico manualmente, caso necessite (pode chamar pela consola F12)
        function limparHistorico() {
            localStorage.removeItem('historicoESP32');
            location.reload();
        }

        client.on('error', function (error) {
            console.error("Erro MQTT:", error);
            document.getElementById('status').innerText = 'Erro de conexão';
            document.getElementById('status').style.color = '#ff4444';
        });
    </script>
</body>
</html>
